name: backend-ci

on:
  push:
    paths: ['velan-backend/**']
  pull_request:
    paths: ['velan-backend/**']

defaults:
  run:
    working-directory: velan-backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: velan-backend/package-lock.json
      - run: npm ci
      - name: Typecheck (app + scripts)
        run: npx tsc -p tsconfig.json --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
