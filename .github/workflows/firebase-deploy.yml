name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Web → Firebase Hosting (live) on push to main ──────────────────────
  deploy_web_live:
    name: Web → Firebase Hosting (live)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: velan_spaces_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: velan_spaces_flutter
        run: flutter analyze --no-fatal-infos

      - name: Build web (release)
        working-directory: velan_spaces_flutter
        run: flutter build web --release --web-renderer canvaskit

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VELAN_SPACES_CONSTRUCTIONS }}
          projectId: velan-spaces-constructions
          channelId: live
          entryPoint: ./velan_spaces_flutter

  # ── Web → Firebase Hosting (preview) on pull requests ──────────────────
  deploy_web_preview:
    name: Web → Firebase Hosting (preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: velan_spaces_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: velan_spaces_flutter
        run: flutter analyze --no-fatal-infos

      - name: Build web (release)
        working-directory: velan_spaces_flutter
        run: flutter build web --release --web-renderer canvaskit

      - name: Deploy to Firebase Hosting (preview channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VELAN_SPACES_CONSTRUCTIONS }}
          projectId: velan-spaces-constructions
          entryPoint: ./velan_spaces_flutter

  # ── Android AAB → Play Store (internal track) on push to main ──────────
  build_android:
    name: Android AAB → Play Store (internal)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: velan_spaces_flutter
        run: flutter pub get

      # Decode keystore from base64 secret into the expected path
      - name: Decode keystore
        run: |
          mkdir -p velan_spaces_flutter/android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > velan_spaces_flutter/android/keystore/velan-spaces-release.jks

      - name: Build Android App Bundle (release)
        working-directory: velan_spaces_flutter
        env:
          KEYSTORE_PATH: ../keystore/velan-spaces-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload AAB to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.velanspaces.velan_spaces_flutter
          releaseFiles: velan_spaces_flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
