# Velan Spaces — nginx reverse proxy (alternative to the Caddy profile).
#
# Assumes nginx runs ON THE HOST (e.g. apt install nginx certbot) and the compose
# stack publishes the containers on loopback (BIND_ADDR=127.0.0.1, the default).
# If nginx runs as a container on the compose network, use web:3100 / api:3000.
#
# Install:  /etc/nginx/conf.d/velan.conf  →  nginx -t && systemctl reload nginx
# TODO(client): replace velanspaces.example / api.velanspaces.example everywhere.
# Certificates (first time, before enabling the 443 blocks):
#   certbot certonly --webroot -w /var/www/certbot -d velanspaces.example -d api.velanspaces.example

upstream velan_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream velan_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- :80 — ACME challenges + redirect everything to HTTPS ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name velanspaces.example api.velanspaces.example;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Web app ---------------------------------------------------------------------
server {
    listen 443 ssl http2;   # nginx >= 1.25.1 may prefer: listen 443 ssl; http2 on;
    listen [::]:443 ssl http2;
    server_name velanspaces.example;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/velanspaces.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velanspaces.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:velan_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # File bytes go straight to Supabase Storage via signed URLs; only JSON passes here.
    client_max_body_size 10m;

    location / {
        proxy_pass http://velan_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # OVERWRITE (never append with $proxy_add_x_forwarded_for): the web BFF forwards
        # this single value to the API, which trusts exactly 1 hop (TRUST_PROXY_HOPS=1).
        # Appending would let a client inject a fake IP and dodge login rate limits.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Next.js streams (Suspense / partial prerendering) — don't buffer responses.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# --- API for the mobile apps (and the Flutter web build) — optional -------------
# Remove this server block if the API must not be reachable from the internet.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.velanspaces.example;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/velanspaces.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velanspaces.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:velan_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://velan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite — see above
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
